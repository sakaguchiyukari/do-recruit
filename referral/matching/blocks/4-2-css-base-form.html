<!-- [4-2/8] CSS基本デザイン：検索フォーム
     貼り付け場所：前のブロックの下（記事内ならどこでも可）
     役割：検索フォーム（入力欄・こだわり条件・リセットボタン）の見た目
     ※ div.yzw-app の中だけに効き、!important でブログ側CSSの干渉を防ぐ -->
<style>
div#yzw-match-form .yzw-form{display:grid !important;grid-template-columns:1fr 1fr !important;gap:20px !important;margin:0 !important;padding:24px !important;border:2px solid #1F3A5F !important;border-radius:24px !important;background:#FFFFFF !important;box-shadow:6px 6px 0 #1F3A5F !important;}
div#yzw-match-form .yzw-fieldset{min-width:0 !important;margin:0 !important;padding:18px !important;border:0 !important;border-radius:16px !important;background:#F4F7FB !important;}
div#yzw-match-form .yzw-legend{float:left !important;width:100% !important;margin:0 0 12px !important;padding:0 !important;font-size:15px !important;font-weight:700 !important;color:#1F3A5F !important;}
div#yzw-match-form .yzw-legend-num{display:inline-block !important;width:24px !important;height:24px !important;margin-right:8px !important;border-radius:50% !important;background:#D6246A !important;color:#FFFFFF !important;font-size:13px !important;line-height:24px !important;text-align:center !important;}
div#yzw-match-form .yzw-field{clear:both !important;display:block !important;margin:0 0 12px !important;}
div#yzw-match-form .yzw-label{display:block !important;margin-bottom:4px !important;font-size:13px !important;font-weight:700 !important;}
div.yzw-app .yzw-select,div.yzw-app .yzw-input{display:block !important;width:100% !important;height:44px !important;margin:0 !important;padding:0 12px !important;border:2px solid #1F3A5F !important;border-radius:10px !important;background:#FFFFFF !important;color:#1F3A5F !important;font-size:15px !important;font-family:inherit !important;box-shadow:none !important;}
div.yzw-app .yzw-select:focus,div.yzw-app .yzw-input:focus{outline:3px solid #9FD8FF !important;outline-offset:1px !important;}
div.yzw-app .yzw-select--small{display:inline-block !important;width:auto !important;height:38px !important;font-size:14px !important;}
div#yzw-match-form .yzw-tag-choices{display:flex !important;flex-wrap:wrap !important;gap:8px !important;}
div#yzw-match-form .yzw-chip{display:inline-block !important;margin:0 !important;cursor:pointer !important;}
div#yzw-match-form .yzw-chip input{position:absolute !important;opacity:0 !important;width:1px !important;height:1px !important;}
div#yzw-match-form .yzw-chip span{display:inline-block !important;padding:6px 14px !important;border:2px solid #1F3A5F !important;border-radius:999px !important;background:#FFFFFF !important;font-size:13px !important;font-weight:700 !important;transition:background 0.2s ease, transform 0.2s ease !important;}
div#yzw-match-form .yzw-chip:hover span{transform:translateY(-2px) !important;}
div#yzw-match-form .yzw-chip input:checked + span{background:#FFE45C !important;}
div#yzw-match-form .yzw-chip input:focus-visible + span{outline:3px solid #9FD8FF !important;}
div#yzw-match-form .yzw-form-actions{grid-column:1 / -1 !important;display:flex !important;flex-wrap:wrap !important;align-items:center !important;justify-content:space-between !important;gap:12px !important;}
div#yzw-match-form .yzw-check{display:inline-flex !important;align-items:center !important;gap:6px !important;margin:0 !important;font-size:14px !important;cursor:pointer !important;}
div#yzw-match-form .yzw-check input{width:18px !important;height:18px !important;margin:0 !important;}
div#yzw-match-form .yzw-btn-reset{margin:0 !important;padding:10px 20px !important;border:2px solid #1F3A5F !important;border-radius:999px !important;background:#FFFFFF !important;color:#1F3A5F !important;font-size:14px !important;font-weight:700 !important;cursor:pointer !important;transition:background 0.2s ease !important;}
div#yzw-match-form .yzw-btn-reset:hover{background:#FFB3CB !important;}
</style>
