<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リファラル採用マッチング（完成イメージ）</title>
</head>
<body style="margin:0;padding:24px 16px;background:#FFFFFF;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;">
<!-- 確認用：blocks/ の12ブロックを順番どおりにつなげたもの -->
<!-- =====================================================
     [1/8] HTML基本構造
     貼り付け場所：記事のいちばん上（ほかのブロックより前）
     役割：タイトル・説明文の表示。JavaScriptが無効な環境ではお知らせを表示
     ===================================================== -->
<div id="yzw-match-head" class="yzw-app">
  <p class="yzw-eyebrow">REFERRAL MATCHING</p>
  <h2 class="yzw-title">あの人にぴったりの求人を探そう</h2>
  <p class="yzw-lead">紹介したい人の希望条件を選ぶと、グループ各社の求人とのマッチ度が表示されます。</p>
  <noscript>
    <p class="yzw-alert">この検索機能はJavaScriptを使用しています。ブラウザの設定でJavaScriptを有効にしてください。</p>
  </noscript>
</div>

<!-- =====================================================
     [2/8] HTML検索フォーム
     貼り付け場所：[1/8] の下
     役割：絞り込み（職種・業種・キーワード）と希望条件（勤務地・雇用形態・こだわり）の入力欄
     ※選択肢は [8/8] 求人データから自動で作られるため、ここを編集する必要はありません
     ===================================================== -->
<div id="yzw-match-form" class="yzw-app">
  <form id="yzw-form" class="yzw-form" action="#" autocomplete="off">

    <!-- 絞り込み：一致しない求人は表示しない -->
    <fieldset class="yzw-fieldset">
      <legend class="yzw-legend"><span class="yzw-legend-num">1</span>求人を絞り込む</legend>
      <label class="yzw-field" for="yzw-f-jobtype">
        <span class="yzw-label">職種</span>
        <select id="yzw-f-jobtype" name="jobType" class="yzw-select">
          <option value="">すべての職種</option>
        </select>
      </label>
      <label class="yzw-field" for="yzw-f-industry">
        <span class="yzw-label">業種</span>
        <select id="yzw-f-industry" name="industry" class="yzw-select">
          <option value="">すべての業種</option>
        </select>
      </label>
      <label class="yzw-field" for="yzw-f-keyword">
        <span class="yzw-label">キーワード</span>
        <input type="search" id="yzw-f-keyword" name="keyword" class="yzw-input" placeholder="例：接客、未経験" maxlength="50">
      </label>
    </fieldset>

    <!-- 希望条件：マッチ度の計算に使う -->
    <fieldset class="yzw-fieldset">
      <legend class="yzw-legend"><span class="yzw-legend-num">2</span>希望条件（マッチ度に反映）</legend>
      <label class="yzw-field" for="yzw-f-area">
        <span class="yzw-label">勤務地</span>
        <select id="yzw-f-area" name="area" class="yzw-select">
          <option value="">こだわらない</option>
        </select>
      </label>
      <label class="yzw-field" for="yzw-f-employment">
        <span class="yzw-label">雇用形態</span>
        <select id="yzw-f-employment" name="employment" class="yzw-select">
          <option value="">こだわらない</option>
        </select>
      </label>
      <div class="yzw-field">
        <span class="yzw-label">こだわり条件</span>
        <div id="yzw-f-tags" class="yzw-tag-choices"></div>
      </div>
    </fieldset>

    <!-- 操作 -->
    <div class="yzw-form-actions">
      <label class="yzw-check" for="yzw-f-closed">
        <input type="checkbox" id="yzw-f-closed" name="showClosed" value="1">
        <span>募集終了の求人も表示</span>
      </label>
      <button type="reset" class="yzw-btn-reset">条件をリセット</button>
    </div>

  </form>
</div>

<!-- =====================================================
     [3/8] HTML検索結果
     貼り付け場所：[2/8] の下
     役割：件数・並び替え・求人カードの表示場所（カードはJavaScriptが自動で作成）
     ===================================================== -->
<div id="yzw-match-results" class="yzw-app">
  <div class="yzw-result-head">
    <p id="yzw-count" class="yzw-count" aria-live="polite">求人を読み込み中です…</p>
    <label class="yzw-sort" for="yzw-sort">
      <span class="yzw-sort-label">並び順</span>
      <select id="yzw-sort" name="sort" class="yzw-select yzw-select--small">
        <option value="match">マッチ度が高い順</option>
        <option value="new">新着順</option>
      </select>
    </label>
  </div>
  <div id="yzw-list" class="yzw-list"></div>
  <p id="yzw-empty" class="yzw-empty" style="display:none;">条件に合う求人が見つかりませんでした。条件を減らして探してみてください。</p>
</div>

<!-- [4-1/8] CSS基本デザイン：共通・ヘッダー

     役割：文字色・余白のリセットと、タイトル部分の見た目

<!-- [6-1/8] JavaScript検索機能：カード表示
     貼り付け場所：前のブロックの下
     役割：共通の道具（文字の安全化など）・入力値の読み取り・求人カード1枚分のHTMLを作る処理
     ※名前はすべて window.YZW の中にまとめ、ブログ側との衝突を防ぐ -->
<script>
(function () {
  'use strict';
  const Y = window.YZW = window.YZW || {};

  // 共通の道具
  Y.util = {
    byId: function (id) { return document.getElementById(id); },
    // データ内の < > などをHTMLとして解釈させない
    esc: function (v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    },
    // 重複と空欄を除く
    uniq: function (list) {
      const out = [];
      list.forEach(function (v) { if (v && out.indexOf(v) === -1) { out.push(v); } });
      return out;
    },
    // https:// で始まるURLだけを許可
    safeUrl: function (u) {
      return /^https:\/\/[^\s"'<>]+$/.test(String(u || '')) ? u : '';
    }
  };

  function byId(id) { return document.getElementById(id); }

  // 選択肢（option）を追加
  Y.fillSelect = function (id, values) {
    const el = byId(id);
    if (!el) { return; }
    values.forEach(function (v) {
      const o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      el.appendChild(o);
    });
  };

  // フォームの入力値を読み取る
  Y.getPrefs = function () {
    const tags = [];
    document.querySelectorAll('#yzw-f-tags input:checked').forEach(function (el) { tags.push(el.value); });
    return {
      jobType: byId('yzw-f-jobtype').value,
      industry: byId('yzw-f-industry').value,
      keyword: byId('yzw-f-keyword').value.trim().toLowerCase(),
      area: byId('yzw-f-area').value,
      employment: byId('yzw-f-employment').value,
      tags: tags,
      showClosed: byId('yzw-f-closed').checked,
      sort: byId('yzw-sort') ? byId('yzw-sort').value : 'match'
    };
  };

  const STATUS = {
    open: { label: '募集中', cls: 'open' },
    few: { label: '残りわずか', cls: 'few' },
    closed: { label: '募集終了', cls: 'closed' }
  };

  // 求人カード1枚分のHTML
  Y.cardHtml = function (item, prefs) {
    const esc = Y.util.esc;
    const job = item.job;
    const co = item.company || {};
    const st = STATUS[job.status] || STATUS.open;
    const m = item.match;
    const url = Y.util.safeUrl(job.formUrl);
    const closed = job.status === 'closed';

    const tags = (job.tags || []).map(function (t) {
      const hit = prefs.tags.indexOf(t) !== -1;
      return '<span class="yzw-tag' + (hit ? ' yzw-tag--hit' : '') + '">#' + esc(t) + '</span>';
    }).join('');

    const score = m.score === null
      ? '<div class="yzw-score yzw-score--none">希望条件を選ぶと、マッチ度が表示されます。</div>'
      : '<div class="yzw-score"><div class="yzw-score-head"><span>マッチ度</span><span class="yzw-score-num">' + m.score + '%</span></div>' +
        '<span class="yzw-bar"><span class="yzw-bar-fill" style="width:' + m.score + '%;"></span></span>' +
        '<p class="yzw-reasons">' + (m.reasons.length ? esc(m.reasons.join(' / ')) : '一致する希望条件はありません') + '</p></div>';

    const apply = (url && !closed)
      ? '<a class="yzw-apply" href="' + esc(url) + '" target="_blank" rel="noopener">この求人で応募する →</a>'
      : '<span class="yzw-apply yzw-apply--disabled">' + (closed ? '募集は終了しました' : '応募フォーム準備中') + '</span>';

    return '<article class="yzw-card' + (closed ? ' yzw-card--closed' : '') + '">' +

      '<h3 class="yzw-job-title">' + esc(job.title) + '</h3>' +
      '<div class="yzw-meta"><span>📍 ' + esc(job.area) + '</span><span>💼 ' + esc(job.jobType) + '</span><span>🏷 ' + esc(job.employment) + '</span></div>' +

      score +
      '<details class="yzw-detail"><summary>くわしく見る</summary><dl>' +

      '<dt>勤務時間</dt><dd>' + esc(job.hours) + '</dd>' +

<!-- [6-2/8] JavaScript検索機能：絞り込み・起動
     貼り付け場所：前のブロックの下
     役割：選択肢の自動作成・絞り込み・並び替え・表示。必要なブロックがそろった時点で起動する
     ※ブロックが足りないときは、件数の欄に足りないブロック名を表示する -->
<script>
(function () {
  'use strict';
  const Y = window.YZW = window.YZW || {};
  function byId(id) { return document.getElementById(id); }

  // 絞り込み → 並び替え → 表示
  Y.render = function () {
    const d = Y.data;
    const p = Y.getPrefs();
    const cos = {};
    (d.companies || []).forEach(function (c) { cos[c.id] = c; });

    const items = (d.jobs || []).map(function (job) {
      const co = cos[job.companyId];
      return { job: job, company: co, match: Y.calcMatch(job, co, p) };
    }).filter(function (it) {
      const j = it.job;
      const c = it.company || {};
      if (!p.showClosed && j.status === 'closed') { return false; }
      if (p.jobType && j.jobType !== p.jobType) { return false; }
      if (p.industry && c.industry !== p.industry) { return false; }
      if (p.keyword) {
        const text = [j.title, j.jobType, j.description, (j.tags || []).join(' '), c.name, c.industry].join(' ').toLowerCase();
        if (text.indexOf(p.keyword) === -1) { return false; }
      }
      return true;
    });

    // 募集終了は後ろ。マッチ度順または新着順
    items.sort(function (a, b) {
      const ca = a.job.status === 'closed' ? 1 : 0;
      const cb = b.job.status === 'closed' ? 1 : 0;
      if (ca !== cb) { return ca - cb; }
      if (p.sort === 'match') {
        const sa = a.match.score === null ? -1 : a.match.score;
        const sb = b.match.score === null ? -1 : b.match.score;
        if (sa !== sb) { return sb - sa; }
      }
      return String(b.job.posted || '').localeCompare(String(a.job.posted || ''));
    });

    byId('yzw-list').innerHTML = items.map(function (it) { return Y.cardHtml(it, p); }).join('');
    byId('yzw-empty').style.display = items.length ? 'none' : 'block';
    byId('yzw-count').innerHTML = '<strong>' + items.length + '</strong> 件の求人' +
      (d.updated ? '<span style="font-weight:400;font-size:12px;margin-left:8px;">（' + Y.util.esc(d.updated) + ' 更新）</span>' : '');
  };

  // 起動（すべてのブロックがそろったら1回だけ）
  Y.tryInit = function () {
    if (Y.started || !Y.data || !Y.calcMatch || !Y.cardHtml || !Y.getPrefs || !byId('yzw-form') || !byId('yzw-list')) { return; }
    Y.started = true;
    const u = Y.util;
    const jobs = Y.data.jobs || [];
    const cos = Y.data.companies || [];

    Y.fillSelect('yzw-f-jobtype', u.uniq(jobs.map(function (j) { return j.jobType; })));
    Y.fillSelect('yzw-f-industry', u.uniq(cos.map(function (c) { return c.industry; })));
    Y.fillSelect('yzw-f-area', u.uniq(jobs.map(function (j) { return j.area; })));
    Y.fillSelect('yzw-f-employment', u.uniq(jobs.map(function (j) { return j.employment; })));

    const all = [];
    jobs.forEach(function (j) { (j.tags || []).forEach(function (t) { all.push(t); }); });
    const box = byId('yzw-f-tags');
    if (box) {
      box.innerHTML = u.uniq(all).map(function (t, i) {
        return '<label class="yzw-chip" for="yzw-tag-' + i + '"><input type="checkbox" id="yzw-tag-' + i +
          '" name="tags" value="' + u.esc(t) + '"><span>' + u.esc(t) + '</span></label>';
      }).join('');
    }

    const form = byId('yzw-form');
    form.addEventListener('change', Y.render);
    form.addEventListener('input', Y.render);
    form.addEventListener('submit', function (e) { e.preventDefault(); Y.render(); });
    form.addEventListener('reset', function () { setTimeout(Y.render, 0); });
    if (byId('yzw-sort')) { byId('yzw-sort').addEventListener('change', Y.render); }
    Y.render();
  };

  // 読み込み後も起動していなければ、足りないブロックを表示
  function checkMissing() {
    if (Y.started) { return; }
    const miss = [];
    if (!byId('yzw-form')) { miss.push('[2/8] 検索フォーム'); }
    if (!byId('yzw-list')) { miss.push('[3/8] 検索結果'); }
    if (!Y.cardHtml) { miss.push('[6-1/8] カード表示'); }
    if (!Y.calcMatch) { miss.push('[7/8] マッチング計算'); }
    if (!Y.data) { miss.push('[8/8] 求人データ'); }
    const el = byId('yzw-count');
    if (el && miss.length) { el.textContent = '読み込みに失敗しました。見つからないブロック：' + miss.join('、'); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', Y.tryInit);
  } else {
    Y.tryInit();
  }
  window.addEventListener('load', function () { Y.tryInit(); checkMissing(); });
})();
</script>

<!-- =====================================================
     [7/8] JavaScriptマッチング計算
     貼り付け場所：[6-2/8] の下
     役割：希望条件と求人を比べて、マッチ度（0〜100%）と一致した理由を返す
     ・配点（WEIGHTS）の数字を変えると、重視する条件を調整できる
     ・選ばれていない条件は計算から外す（こだわらない＝減点しない）
     ===================================================== -->
<script>
(function () {
  'use strict';

  const Y = window.YZW = window.YZW || {};

  // 条件ごとの配点（合計が100でなくても、自動で割合に直します）
  const WEIGHTS = {
    area: 35,        // 勤務地
    employment: 30,  // 雇用形態
    tags: 35         // こだわり条件（選んだうち何個に対応しているか）
  };

  Y.calcMatch = function (job, company, prefs) {
    let possible = 0;
    let earned = 0;
    const reasons = [];

    if (prefs.area) {
      possible += WEIGHTS.area;
      if (job.area === prefs.area) {
        earned += WEIGHTS.area;
        reasons.push('勤務地が一致');
      }
    }

    if (prefs.employment) {
      possible += WEIGHTS.employment;
      if (job.employment === prefs.employment) {
        earned += WEIGHTS.employment;
        reasons.push('雇用形態が一致');
      }
    }

    if (prefs.tags && prefs.tags.length) {
      possible += WEIGHTS.tags;
      const jobTags = job.tags || [];
      const hits = prefs.tags.filter(function (t) { return jobTags.indexOf(t) !== -1; });
      earned += WEIGHTS.tags * hits.length / prefs.tags.length;
      if (hits.length) {
        reasons.push(hits.join('・') + ' に対応');
      }
    }

    // 希望条件が1つも選ばれていなければ、マッチ度は表示しない
    if (possible === 0) {
      return { score: null, reasons: [] };
    }
    return { score: Math.round(earned / possible * 100), reasons: reasons };
  };

  if (Y.tryInit) { Y.tryInit(); }
})();
</script>
