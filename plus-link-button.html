<!--
  ============================================================
  Plus Link Button（＋装飾リンク）
  SWELL WordPress テーマ用 / カスタムHTMLブロックに貼り付け
  ============================================================

  【設置手順】
  1. このHTMLを「カスタムHTML」ブロックに貼り付け（JSも同梱）
  2. plus-link-button.css の内容を
     「外観 > カスタマイズ > 追加CSS」に貼り付け

  【名前空間】
  ブロック  .plus-link ／ ラッパー .plus-button ／ CSS変数 --pl-*
  既存の .news-button / .expand-pill とは完全に分離しているため、
  同じページに並べても干渉しません。
-->

<div class="plus-button js-plus-fade">
  <a class="plus-link" href="https://doyg.jp/">
    <span class="plus-link__label">View Website</span>
    <span class="plus-link__mark" aria-hidden="true"></span>
  </a>
</div>

<script>
/* ================================================
   Plus Link Button - フェードイン
   IntersectionObserver で画面内に入ったら
   .is-plus-shown を付与する
   ================================================ */
(() => {
  const targets = document.querySelectorAll('.js-plus-fade');

  if (!targets.length) return;

  // モーション軽減設定時は即表示
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    targets.forEach((el) => el.classList.add('is-plus-shown'));
    return;
  }

  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('is-plus-shown');
      obs.unobserve(entry.target);
    });
  }, { rootMargin: '0px 0px -10% 0px', threshold: 0.15 });

  targets.forEach((el) => observer.observe(el));
})();
</script>
