<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
  <!-- 仮画像：TOPと同じタッチのアイソメトリック・イラスト（人が人を紹介している場面）に差し替える -->
  <!-- 地面 -->
  <path d="M280 120 L520 250 L280 380 L40 250 Z" fill="#ffffff"/>
  <path d="M40 250 L280 380 L280 396 L40 266 Z" fill="#dbeef5"/>
  <path d="M520 250 L280 380 L280 396 L520 266 Z" fill="#c4e3ee"/>
  <!-- 建物 -->
  <path d="M330 150 L410 193 L410 120 L330 77 Z" fill="#e9f4f8"/>
  <path d="M410 193 L460 166 L460 93 L410 120 Z" fill="#cfe6ef"/>
  <path d="M330 77 L380 50 L460 93 L410 120 Z" fill="#f7fbfd"/>
  <g fill="#7fc6db">
    <rect x="343" y="98" width="12" height="16" transform="skewY(28)" transform-origin="343 98"/>
    <rect x="363" y="109" width="12" height="16" transform="skewY(28)" transform-origin="363 109"/>
    <rect x="383" y="120" width="12" height="16" transform="skewY(28)" transform-origin="383 120"/>
  </g>
  <!-- 木 -->
  <g fill="#3a8fc0">
    <ellipse cx="150" cy="215" rx="11" ry="22"/>
    <ellipse cx="470" cy="225" rx="11" ry="22"/>
  </g>
  <!-- 人物（紹介する人 → 紹介される人） -->
  <g>
    <circle cx="210" cy="232" r="9" fill="#f3d2b5"/>
    <rect x="200" y="242" width="20" height="34" rx="8" fill="#3a9ec4"/>
    <rect x="203" y="274" width="6" height="22" fill="#33393f"/>
    <rect x="211" y="274" width="6" height="22" fill="#33393f"/>
  </g>
  <g>
    <circle cx="270" cy="250" r="9" fill="#f3d2b5"/>
    <rect x="260" y="260" width="20" height="34" rx="8" fill="#ffdf6e"/>
    <rect x="263" y="292" width="6" height="22" fill="#33393f"/>
    <rect x="271" y="292" width="6" height="22" fill="#33393f"/>
  </g>
  <g>
    <circle cx="330" cy="268" r="9" fill="#f3d2b5"/>
    <rect x="320" y="278" width="20" height="34" rx="8" fill="#f2826f"/>
    <rect x="323" y="310" width="6" height="22" fill="#33393f"/>
    <rect x="331" y="310" width="6" height="22" fill="#33393f"/>
  </g>
  <!-- つながりの線 -->
  <path d="M222 236 Q240 220 258 244 M282 254 Q300 238 318 262" fill="none" stroke="#137cb5" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- 吹き出し -->
  <rect x="196" y="176" width="88" height="36" rx="18" fill="#ffffff"/>
  <text x="240" y="199" font-family="Hiragino Maru Gothic ProN, Meiryo, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#137cb5">紹介するね！</text>
</svg>
