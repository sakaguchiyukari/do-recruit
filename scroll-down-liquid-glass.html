<!--
  SWELL WordPress テーマ用
  Liquid Glass スクロールダウンインジケーター

  使い方:
  1. SWELLカスタマイザー > 追加CSS に scroll-down-liquid-glass.css の内容を貼り付け
  2. フロントページのカスタムHTMLブロック または functions.php の wp_footer に下記を追加

  ファーストビュー（ヒーローセクション）の直後、またはヒーロー内の末尾に配置してください。
-->

<!-- ===================== HTML ===================== -->
<div class="lg-scroll-indicator" id="lgScrollIndicator" aria-label="スクロールして続きを見る" role="button" tabindex="0">

  <!-- 液体ガラスの外殻 -->
  <div class="lg-capsule">

    <!-- SVGフィルター: 動的屈折シミュレーション -->
    <svg class="lg-svg-filters" aria-hidden="true">
      <defs>
        <filter id="lg-refraction" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.015 0.025"
            numOctaves="3"
            seed="2"
            result="noise">
            <animate
              attributeName="baseFrequency"
              values="0.015 0.025; 0.02 0.03; 0.015 0.025"
              dur="8s"
              repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="3"
            xChannelSelector="R"
            yChannelSelector="G"
            result="displaced"/>
        </filter>

        <filter id="lg-inner-glow">
          <feGaussianBlur stdDeviation="1.5" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <!-- ガラスの縁のハイライト用グラデーション -->
        <linearGradient id="lg-rim-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
          <stop offset="30%" stop-color="rgba(255,255,255,0.3)"/>
          <stop offset="70%" stop-color="rgba(255,255,255,0.05)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0.4)"/>
        </linearGradient>

        <radialGradient id="lg-depth-gradient" cx="35%" cy="25%" r="60%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
        </radialGradient>
      </defs>
    </svg>

    <!-- 背景の屈折レイヤー（背景を歪ませる擬似効果） -->
    <div class="lg-refraction-layer" aria-hidden="true"></div>

    <!-- ガラス本体 -->
    <div class="lg-glass-body">

      <!-- 物理的な奥行き: 背面ガラス -->
      <div class="lg-depth-back" aria-hidden="true"></div>

      <!-- メインガラス面 -->
      <div class="lg-glass-surface">

        <!-- 上部ハイライト（光の反射） -->
        <div class="lg-highlight-top" aria-hidden="true"></div>

        <!-- 側面の光の屈折ライン -->
        <div class="lg-rim-left" aria-hidden="true"></div>
        <div class="lg-rim-right" aria-hidden="true"></div>

        <!-- スクロールテキスト -->
        <span class="lg-label">SCROLL</span>

        <!-- 矢印アニメーション -->
        <div class="lg-arrow-container" aria-hidden="true">
          <div class="lg-arrow lg-arrow-1">
            <svg viewBox="0 0 16 10" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 1L8 8L15 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="lg-arrow lg-arrow-2">
            <svg viewBox="0 0 16 10" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 1L8 8L15 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <!-- 内側の光の粒子 -->
        <div class="lg-particle lg-p1" aria-hidden="true"></div>
        <div class="lg-particle lg-p2" aria-hidden="true"></div>
        <div class="lg-particle lg-p3" aria-hidden="true"></div>

        <!-- 底面のカーブハイライト -->
        <div class="lg-highlight-bottom" aria-hidden="true"></div>

      </div>

    </div>

    <!-- 外側グロー -->
    <div class="lg-outer-glow" aria-hidden="true"></div>

  </div>

  <!-- マウスオーバー時の液体波紋 -->
  <canvas class="lg-ripple-canvas" id="lgRippleCanvas" aria-hidden="true"></canvas>

</div>
