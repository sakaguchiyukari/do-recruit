<!--
  ============================================================
  Photo Flow Slider（写真が横に流れる無限スライダー）
  SWELL WordPress テーマ / カスタムHTMLブロック用

  【設置手順】
  1. photo-flow-slider.css の内容を
     「外観 > カスタマイズ > 追加CSS」に貼り付ける
  2. このファイルの内容を、設置したい場所の
     「カスタムHTML」ブロックにそのまま貼り付ける

  【写真の増減】
  .pflow__item を増減するだけ。複製・ループ処理はJSが自動で行う。
  サイズ    … pflow__item--tall / --square / --wide / --small / --portrait / --large
  縦位置    … pflow__item--shift-up-lg / --shift-up-sm / --shift-down-sm / --shift-down-lg

  【2段にしたい場合】
  下記 .pflow__row をコピーし、--left を --right に変えると逆方向に流れる。
  ============================================================
-->

<div class="pflow" data-pflow>

  <!-- ===== ROW A：左へ流れる ===== -->
  <div class="pflow__row pflow__row--left" data-pflow-row>

    <figure class="pflow__item pflow__item--tall pflow__item--shift-up-lg">
      <img class="pflow__image" src="https://recruit.doyg.jp/wp-content/uploads/2026/07/20250318_0083-scaled.jpg" alt="" loading="lazy" decoding="async">
    </figure>

    <figure class="pflow__item pflow__item--square pflow__item--shift-down-sm">
      <img class="pflow__image" src="https://recruit.doyg.jp/wp-content/uploads/2026/07/imgi_63_img-service03@2x.jpg" alt="" loading="lazy" decoding="async">
    </figure>

    <figure class="pflow__item pflow__item--wide pflow__item--shift-up-sm">
      <img class="pflow__image" src="https://recruit.doyg.jp/wp-content/uploads/2026/09/316A4191-scaled.png" alt="" loading="lazy" decoding="async">
    </figure>

    <figure class="pflow__item pflow__item--small pflow__item--shift-down-lg">
      <img class="pflow__image" src="https://recruit.doyg.jp/wp-content/uploads/2026/07/imgi_27_top_service_main_list_item_bg01.jpg" alt="" loading="lazy" decoding="async">
    </figure>

    <figure class="pflow__item pflow__item--large pflow__item--shift-up-lg">
      <img class="pflow__image" src="https://recruit.doyg.jp/wp-content/uploads/2026/07/20260605_0031-scaled.jpg" alt="" loading="lazy" decoding="async">
    </figure>

    <figure class="pflow__item pflow__item--portrait pflow__item--shift-down-sm">
      <img class="pflow__image" src="https://recruit.doyg.jp/wp-content/uploads/2026/08/316A3939-scaled.jpg" alt="" loading="lazy" decoding="async">
    </figure>

    <figure class="pflow__item pflow__item--square pflow__item--shift-up-sm">
      <img class="pflow__image" src="https://recruit.doyg.jp/wp-content/uploads/2026/06/20250604_0139-scaled.jpg" alt="" loading="lazy" decoding="async">
    </figure>

  </div>

</div>

<!--
  JavaScript
  ※インラインのスクリプトには defer が効かないため、
    DOM構築の完了をスクリプト側（readyState）で判定している。
  ※子テーマでエンキューして読み込みたい場合は、下のスクリプトの中身を
    そのまま photo-flow-slider.js として保存し、このブロックを削除する。
-->
<script>
(() => {
  'use strict';

  const ROOT_SELECTOR = '[data-pflow]';
  const ROW_SELECTOR  = '[data-pflow-row]';
  const MAX_DOUBLING  = 6;      // 複製の上限（暴走防止）
  const FALLBACK_SPEED = 40;    // --pflow-speed が読めない場合の速度(px/秒)

  /* ---------------------------------------------------------
     行の中身を「倍」にする
     倍々で増やすことで、常に translateX(-50%) が
     ちょうど整数セット分の移動になり、継ぎ目が生まれない
  --------------------------------------------------------- */
  const doubleRow = (row) => {
    const fragment = document.createDocumentFragment();

    Array.from(row.children).forEach((item) => {
      const clone = item.cloneNode(true);
      clone.setAttribute('aria-hidden', 'true');   // 複製分は支援技術から隠す
      fragment.appendChild(clone);
    });

    row.appendChild(fragment);
  };

  /* ---------------------------------------------------------
     画面幅の2倍以上になるまで複製を追加する
     （1周分の幅が画面幅未満だと、折り返し時に空白が見えてしまう）
     すでに足りている場合は何もしないので、リサイズ時に呼んでも増え続けない
  --------------------------------------------------------- */
  const fillRow = (row, minWidth) => {
    let count = 0;

    while (row.scrollWidth < minWidth && count < MAX_DOUBLING) {
      doubleRow(row);
      count += 1;
    }
  };

  /* ---------------------------------------------------------
     速度を一定に保つ
     複製数や画面幅が変わっても見た目の流れる速さを揃えるため、
     移動距離（全体幅の半分）から再生時間を逆算する
  --------------------------------------------------------- */
  const updateDuration = (root, row) => {
    const speed = parseFloat(getComputedStyle(root).getPropertyValue('--pflow-speed')) || FALLBACK_SPEED;
    const distance = row.scrollWidth / 2;

    row.style.setProperty('--pflow-duration', `${(distance / speed).toFixed(2)}s`);
  };

  /* ---------------------------------------------------------
     IntersectionObserver
     画面内 … フェードイン＋アニメーション再生
     画面外 … アニメーション停止（描画負荷の軽減）
  --------------------------------------------------------- */
  const createObserver = () => {
    if (!('IntersectionObserver' in window)) return null;

    return new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        entry.target.classList.toggle('pflow--running', entry.isIntersecting);
        if (entry.isIntersecting) {
          entry.target.classList.add('pflow--visible'); // フェードインは一度だけ
        }
      });
    }, { threshold: 0, rootMargin: '10% 0px' });
  };

  /* ---------------------------------------------------------
     初期化
  --------------------------------------------------------- */
  const init = () => {
    const roots = Array.from(document.querySelectorAll(ROOT_SELECTOR));
    if (roots.length === 0) return;

    const observer = createObserver();

    // { root, rows } の組を保持し、リサイズ時に使い回す
    const sliders = roots.map((root) => ({
      root,
      rows: Array.from(root.querySelectorAll(ROW_SELECTOR))
    }));

    // まず全行を2セットにする（ループの前提条件）
    sliders.forEach(({ rows }) => rows.forEach(doubleRow));

    const layout = () => {
      sliders.forEach(({ root, rows }) => {
        rows.forEach((row) => {
          fillRow(row, root.clientWidth * 2);
          updateDuration(root, row);
        });
      });
    };

    layout();

    sliders.forEach(({ root }) => {
      // JSが動く環境でのみ初期状態を非表示にする（JS無効時は表示されたまま）
      if (observer) {
        root.classList.add('pflow--ready');
        observer.observe(root);
      }
    });

    // 画面幅の変化に追従（写真幅が clamp() で変わるため再計算する）
    let timer = 0;
    window.addEventListener('resize', () => {
      window.clearTimeout(timer);
      timer = window.setTimeout(layout, 200);
    });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
</script>
