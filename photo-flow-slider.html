</div>

<script>
(function () {
  // 各行を複製してシームレスな無限ループにする
  ['rowA', 'rowB'].forEach(function (id) {
    var row = document.getElementById(id);
    if (row) {
      row.innerHTML += row.innerHTML;
    }
  });
})();
</script>
