<!--
  SWELL WordPress テーマ用
  Expand Pill Button（+ 装飾版）

  使い方:
  1. SWELLカスタマイザー > 追加CSS に expand-pill-button.css の内容を貼り付け
  2. 表示したい箇所のカスタムHTMLブロックに下記 HTML を貼り付け
  3. フェードインさせる場合のみ expand-pill-button.js を読み込む
     （例: <script src="/path/to/expand-pill-button.js" defer></script>）
-->

<!-- ===================== ボタン ===================== -->
<div class="news-button js-fade-in">
  <a class="expand-pill" href="https://doyg.jp/">
    <span class="expand-pill__label">View Website</span>
    <span class="expand-pill__plus" aria-hidden="true"></span>
  </a>
</div>
