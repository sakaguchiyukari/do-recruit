<!-- ==========================================================================
  Coming Soon ブロック（接頭辞：soon-）
  CMS HTMLブロック用：HTML → CSS → JS の順に1ブロックへ集約
  ・h1はCMSが出力するため、ブロック内はh2から開始
  ・写真は不使用（イラストはHTML + CSSで描画）
========================================================================== -->

<!-- ===== セクション：Coming Soon 本体 ===== -->
<section class="soon" aria-labelledby="soon-title">
  <div class="soon__inner">

    <!-- ----- イラスト：制作中のWebページ（装飾のため読み上げ対象外） ----- -->
    <div class="soon__visual soon-fade" aria-hidden="true">
      <div class="soon-scene">
        <span class="soon-scene__halo"></span>
        <span class="soon-scene__spark soon-scene__spark--1"></span>
        <span class="soon-scene__spark soon-scene__spark--2"></span>
        <span class="soon-scene__spark soon-scene__spark--3"></span>

        <!-- ブラウザ画面：骨組みだけのページ -->
        <div class="soon-scene__window">
          <span class="soon-scene__bar"></span>
          <div class="soon-scene__page">
            <span class="soon-scene__media"></span>
            <span class="soon-scene__line soon-scene__line--l"></span>
            <span class="soon-scene__line soon-scene__line--m"></span>
            <span class="soon-scene__line soon-scene__line--s"></span>
          </div>
          <!-- 進捗バー -->
          <span class="soon-scene__progress"></span>
        </div>

        <!-- 歯車（作業中の表現） -->
        <span class="soon-scene__gear soon-scene__gear--lg"></span>
        <span class="soon-scene__gear soon-scene__gear--sm"></span>
      </div>
    </div>

    <!-- ----- テキスト ----- -->
    <div class="soon__body">
      <p class="soon__eyebrow soon-fade">
        <span class="soon__eyebrow-dot" aria-hidden="true"></span>
        Coming Soon
      </p>

      <h2 id="soon-title" class="soon__title soon-fade">
        ただいま、<br>準備をすすめています。
      </h2>

      <p class="soon__lead soon-fade">
        このページは現在制作中です。<br>
        準備が整い次第、公開いたします。<br>
        もうしばらくお待ちください。
      </p>
    </div>

  </div>
</section>

<style>
/* ==========================================================================
   ページ背景の上書き（このブロックがあるページのみ）
   ※ CSS変数はブロック内でしか参照できないため、ここだけ値を直接指定
========================================================================== */
html:has(.soon),
html:has(.soon) body {
  background-color: #f7f8f9 !important;
}

/* ==========================================================================
   ブロック親：CSS変数管理
========================================================================== */
.soon {
  /* --- Color --- */
  --soon-navy: #0b2545;
  --soon-blue: #1b6ca8;
  --soon-blue-pale: #edf4fa;
  --soon-green: #2e6e4f;
  --soon-green-light: #8fc4a6;
  --soon-green-pale: #eef5f1;
  --soon-skeleton: #e6ebf1;        /* 骨組み（読み込み中）の面 */
  --soon-skeleton-strong: #c9d3de; /* タイトルバーの丸 */
  --soon-skeleton-shine: #f6f8fb;  /* 流れる光 */
  --soon-white: #ffffff;
  --soon-text: #1f2a37;
  --soon-text-sub: #5b6675;
  --soon-line: #e3e7ec;

  /* --- Spacing（clampで自然に可変） --- */
  --soon-pad-block: clamp(3.5rem, 2.5rem + 5vw, 7rem);
  --soon-pad-inline: clamp(1.25rem, 0.75rem + 2.5vw, 2.5rem);
  --soon-gap: clamp(2rem, 1rem + 4vw, 4.5rem);
  --soon-stack: clamp(1rem, 0.8rem + 0.8vw, 1.5rem);

  /* --- Type --- */
  --soon-fs-eyebrow: clamp(0.75rem, 0.7rem + 0.2vw, 0.8125rem);
  --soon-fs-title: clamp(1.625rem, 1.2rem + 2vw, 2.5rem);
  --soon-fs-lead: clamp(0.9375rem, 0.9rem + 0.2vw, 1.0625rem);

  /* --- Shape / Motion --- */
  --soon-radius-pill: 999px;
  /* 「+」形（腕の太さ = 中央30%）：きらめき・ラベルのアイコンで共通利用 */
  --soon-plus-shape: polygon(35% 0, 65% 0, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0 65%, 0 35%, 35% 35%);
  --soon-ease: cubic-bezier(0.22, 1, 0.36, 1);

  position: relative;
  padding: var(--soon-pad-block) var(--soon-pad-inline);
  color: var(--soon-text);
  overflow: hidden;
}

/* ブロック内の余白だけをリセット（詳細度0なのでBEM側で上書きしやすい） */
.soon :where(h2, h3, p, ol, ul, li, figure) {
  margin: 0;
  padding: 0;
}
.soon :where(ol, ul) {
  list-style: none;
}
.soon *,
.soon *::before,
.soon *::after {
  box-sizing: border-box;
}

/* ==========================================================================
   レイアウト（SPファースト）
========================================================================== */
.soon__inner {
  display: grid;
  gap: var(--soon-gap);
  max-width: 1040px;
  margin-inline: auto;
  align-items: center;
}

.soon__visual {
  display: grid;
  place-items: center;
}

.soon__body {
  display: grid;
  gap: var(--soon-stack);
  max-width: 34rem;
  margin-inline: auto;
  text-align: center;
}

/* タブレット以上：横並び */
@media (min-width: 768px) {
  .soon__inner {
    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  }
  .soon__body {
    margin-inline: 0;
    text-align: left;
  }
}

/* ==========================================================================
   テキスト
========================================================================== */
.soon__eyebrow {
  display: inline-flex;
  align-items: center;
  justify-self: center;
  gap: 0.6em;
  padding: 0.5em 1.1em;
  border: 1px solid var(--soon-line);
  border-radius: var(--soon-radius-pill);
  background: var(--soon-white);
  color: var(--soon-green);
  font-size: var(--soon-fs-eyebrow);
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
@media (min-width: 768px) {
  .soon__eyebrow {
    justify-self: start;
  }
}

/* 「+」のステータスアイコン（波紋つき） */
.soon__eyebrow-dot {
  position: relative;
  width: 10px;
  height: 10px;
}
/* 本体と波紋の両方を「+」形にする */
.soon__eyebrow-dot::before,
.soon__eyebrow-dot::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--soon-blue);
  clip-path: var(--soon-plus-shape);
}
.soon__eyebrow-dot::after {
  animation: soon-ping 2s var(--soon-ease) infinite;
}

.soon__title {
  color: var(--soon-navy);
  font-size: var(--soon-fs-title);
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: 0.04em;
  word-break: auto-phrase; /* 対応ブラウザでは文節単位で改行 */
}

.soon__lead {
  color: var(--soon-text-sub);
  font-size: var(--soon-fs-lead);
  line-height: 2;
  letter-spacing: 0.03em;
}

/* ==========================================================================
   イラスト：制作中のWebページ（HTML + CSSのみ）
========================================================================== */
.soon-scene {
  position: relative;
  width: clamp(220px, 160px + 16vw, 340px);
  max-width: 100%;
  aspect-ratio: 1 / 1;
}

/* 背景の光輪 */
.soon-scene__halo {
  position: absolute;
  inset: 4%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, var(--soon-white) 0%, transparent 60%),
    linear-gradient(160deg, var(--soon-blue-pale), var(--soon-green-pale));
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.8);
}

/* --- ブラウザ画面 --- */
.soon-scene__window {
  position: absolute;
  top: 24%;
  left: 13%;
  z-index: 1;
  display: grid;
  width: 66%;
  border: 1px solid var(--soon-line);
  border-radius: 10px;
  background: var(--soon-white);
  box-shadow: 0 18px 36px -18px rgb(11 37 69 / 0.35);
  overflow: hidden;
}

/* タイトルバー（3つの丸） */
.soon-scene__bar {
  display: flex;
  align-items: center;
  height: 18px;
  padding-inline: 8px;
  background: var(--soon-blue-pale);
}
.soon-scene__bar::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--soon-skeleton-strong);
  box-shadow: 9px 0 0 var(--soon-skeleton-strong), 18px 0 0 var(--soon-skeleton-strong);
}

/* ページの骨組み：左に画像枠、右に文章行 */
.soon-scene__page {
  display: grid;
  grid-template-columns: 38% 1fr;
  grid-template-rows: repeat(3, auto);
  align-content: center;
  column-gap: 10%;
  row-gap: 8px;
  padding: 12% 10% 10%;
}
.soon-scene__media {
  grid-row: 1 / 4;
  aspect-ratio: 1 / 1;
  border-radius: 6px;
}
.soon-scene__line {
  height: 6px;
  border-radius: 3px;
}
.soon-scene__line--l { width: 100%; }
.soon-scene__line--m { width: 78%; }
.soon-scene__line--s { width: 52%; }

/* 骨組みのキラッと流れる読み込み表現 */
.soon-scene__media,
.soon-scene__line {
  background: linear-gradient(90deg, var(--soon-skeleton) 0%, var(--soon-skeleton-shine) 50%, var(--soon-skeleton) 100%);
  background-size: 200% 100%;
  animation: soon-shimmer 1.8s ease-in-out infinite;
}

/* 進捗バー（下端） */
.soon-scene__progress {
  position: relative;
  height: 5px;
  background: var(--soon-skeleton);
}
.soon-scene__progress::after {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: var(--soon-blue);
  animation: soon-progress 4s var(--soon-ease) infinite;
}

/* --- 歯車：リング + 歯（conic）を mask で中央くり抜き --- */
.soon-scene__gear {
  position: absolute;
  z-index: 2;
  aspect-ratio: 1 / 1;
  background:
    radial-gradient(circle closest-side, transparent 0 22%, var(--soon-gear-color) 23% 70%, transparent 71%),
    repeating-conic-gradient(var(--soon-gear-color) 0 24deg, transparent 0 45deg);
  -webkit-mask: radial-gradient(circle closest-side, transparent 0 22%, #000 23% 100%, transparent 0);
  mask: radial-gradient(circle closest-side, transparent 0 22%, #000 23% 100%, transparent 0);
}
.soon-scene__gear--lg {
  --soon-gear-color: var(--soon-navy);
  right: 11%;
  bottom: 18%;
  width: 22%;
  animation: soon-rotate 8s linear infinite;
}
.soon-scene__gear--sm {
  --soon-gear-color: var(--soon-blue);
  right: 29%;
  bottom: 13%;
  width: 13%;
  animation: soon-rotate 4s linear infinite reverse;
}

/* きらめき（＋形） */
.soon-scene__spark {
  position: absolute;
  width: 14px;
  height: 14px;
  background: var(--soon-blue);
  clip-path: var(--soon-plus-shape);
  opacity: 0.7;
  animation: soon-twinkle 3s ease-in-out infinite;
}
.soon-scene__spark--1 { top: 14%; left: 18%; }
.soon-scene__spark--2 { top: 10%; right: 24%; width: 10px; height: 10px; background: var(--soon-green); animation-delay: 1s; }
.soon-scene__spark--3 { top: 30%; right: 9%; width: 8px; height: 8px; animation-delay: 2s; }

/* ==========================================================================
   フェードイン（JSが .is-ready を付けたときのみ初期状態を隠す）
   → JSが動かない環境でも内容は必ず表示される
========================================================================== */
.soon.is-ready .soon-fade {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.9s var(--soon-ease), transform 0.9s var(--soon-ease);
}
.soon.is-ready .soon-fade.is-visible {
  opacity: 1;
  transform: none;
}
/* 上から順に少しずつ遅らせて表示 */
.soon.is-ready .soon__body > .soon-fade:nth-child(2) { transition-delay: 0.08s; }
.soon.is-ready .soon__body > .soon-fade:nth-child(3) { transition-delay: 0.16s; }

/* ==========================================================================
   Keyframes
========================================================================== */
@keyframes soon-ping {
  0%   { transform: scale(1); opacity: 0.6; }
  80%, 100% { transform: scale(2.6); opacity: 0; }
}
@keyframes soon-shimmer {
  0%   { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}
@keyframes soon-progress {
  0%   { width: 0; }
  70%, 100% { width: 72%; }
}
@keyframes soon-rotate {
  to { transform: rotate(360deg); }
}
@keyframes soon-twinkle {
  0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.2; }
  50%      { transform: scale(1) rotate(45deg); opacity: 0.85; }
}

/* ==========================================================================
   「視差効果を減らす」設定：アニメーション・フェードを停止
========================================================================== */
@media (prefers-reduced-motion: reduce) {
  .soon *,
  .soon *::before,
  .soon *::after {
    animation: none !important;
    transition: none !important;
  }
  .soon.is-ready .soon-fade {
    opacity: 1;
    transform: none;
  }
}
</style>

<script>
/* ==========================================================================
   フェードイン（IntersectionObserver）
   インラインscriptでは defer が効かないため readyState で実行タイミングを判定
========================================================================== */
(() => {
  const init = () => {
    const blocks = document.querySelectorAll('.soon');
    if (!blocks.length) return;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 動きを減らす設定 or 非対応ブラウザでは、何もせず常時表示のまま
    if (reduceMotion || !('IntersectionObserver' in window)) return;

    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        obs.unobserve(entry.target); // 一度表示したら監視を解除
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.15 });

    blocks.forEach((block) => {
      block.classList.add('is-ready');
      // 表示の時間差はCSS側（nth-child）で管理
      block.querySelectorAll('.soon-fade').forEach((el) => observer.observe(el));
    });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
</script>
