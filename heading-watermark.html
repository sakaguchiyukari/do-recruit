<!-- ================================================
     採用サイト 見出し — 背景ウォーターマーク案（HTML）
     背景の大きな英字（__ghost）と、番号付きラベル（__eyebrow）、
     日本語タイトル（__jp）を差し替えて使います。
     ※ __ghost と __eyebrow の英単語は揃えると綺麗です。
     ================================================ -->

<div class="hd-wm">
  <span class="hd-wm__ghost" aria-hidden="true">People</span>
  <span class="hd-wm__eyebrow">03 / People</span>
  <span class="hd-wm__jp">働く人々</span>
</div>
