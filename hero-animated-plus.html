<!--
  ============================================================
  SWELL WordPress テーマ用
  採用ファーストビュー（ヒーロー）＋ 文字の真後ろで動く「＋」装飾
  ============================================================

  【使い方】
  ・この中身をまるごと「カスタムHTML」ブロックに貼り付け（JSも同梱）
  ・CSS … hero-animated-plus.css の中身を
    「外観 > カスタマイズ > 追加CSS」に貼り付け

  【注意】
  ・装飾のクラス名を .circles / li から
    .fv-hero__decor / .fv-hero__plus に変更しています。
    HTMLとCSSは必ず「両方セット」で差し替えてください。
    （片方だけだと装飾が表示されません）
  ・SWELLのカスタムHTMLブロックはブロック内の <script> をそのまま実行するため、
    JSは別欄ではなくこのブロック内に入れています。
-->
<div class="fv-area">
  <section class="fv-hero" id="fvHero">

    <!-- 背景装飾：文字の真後ろを流れる「＋」 -->
    <ul class="fv-hero__decor" aria-hidden="true">
      <li class="fv-hero__plus"></li>
      <li class="fv-hero__plus"></li>
      <li class="fv-hero__plus"></li>
      <li class="fv-hero__plus"></li>
      <li class="fv-hero__plus"></li>
      <li class="fv-hero__plus"></li>
      <li class="fv-hero__plus"></li>
      <li class="fv-hero__plus"></li>
      <li class="fv-hero__plus"></li>
      <li class="fv-hero__plus"></li>
    </ul>

    <!-- キャッチコピー -->
    <h1 class="fv-hero__copy fv-hero__fade">
      <span class="fv-hero__word" id="fvWord">営業のしごと</span>も<br>
      全部ここにある。
    </h1>

    <!-- サブコピー -->
    <p class="fv-hero__sub fv-hero__fade fv-hero__fade--delay1">
      10の企業法人、社会福祉法人、医療法人社団。<br>
      まいにちに「プラス」をつぎつぎと届ける、多彩な仕事と出会える企業グループです。
    </p>

    <!-- ============================================================
         ▼▼▼ CTAボタン ここから ▼▼▼
         不要になったら、この <div class="fv-cta"> ごと削除してください。
         CSS側も「▼▼▼ CTAボタン ここから ▼▼▼」の区間を削除すれば完全に消えます。
         JSは追加していないので、他への影響はありません。

         ・リンク先は href を書き換えるだけ
         ・ボタンを増やす場合は <a class="fv-cta__btn"> を複製
           （自動で横並び＋スマホでは縦積みになります）
         ============================================================ -->
    <div class="fv-cta fv-hero__fade fv-hero__fade--delay2">

      <a class="fv-cta__btn" href="https://recruit.doyg.jp/recruit/">
        <!-- ヒーロー背景の＋装飾と同じ形。装飾なので読み上げ対象外 -->
        <span class="fv-cta__plus" aria-hidden="true"></span>

        <span class="fv-cta__label">募集要項を見る</span>

        <svg class="fv-cta__arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </a>

      <!-- 補足。不要ならこの <p> ごと削除 -->
      <p class="fv-cta__note">各社の応募先・お問い合わせ先を掲載しています</p>

    </div>
    <!-- ▲▲▲ CTAボタン ここまで ▲▲▲ -->

  </section>
</div>

<script>
(() => {
  /* =========================================
     設定値（速度調整はここだけ触ればOK）
     ========================================= */
  const INTERVAL    = 2600; // ワード切替の周期(ms)
  const FADE        = 400;  // フェード時間(ms)　※CSSのtransitionと必ず揃える
  const FIRST_DELAY = 800;  // 1回目の切り替えまでの待ち時間(ms)。0に近いほど即切替

  /* 表示する業種ワード */
  const WORDS = [
    "営業のしごと",
    "福祉のしごと",
    "事務のしごと",
    "技術のしごと",
    "サービスのしごと"
  ];

  const run = () => {
    /* -----------------------------------------
       1. 業種ワードの切り替え
       ----------------------------------------- */
    const wordEl = document.getElementById("fvWord");

    if (wordEl) {
      let index = 0;

      // 1回分の切り替え処理を関数化（使い回すため）
      const changeWord = () => {
        // フェードアウト開始
        wordEl.classList.add("is-changing");

        // フェードが消えきってからテキストを差し替え
        setTimeout(() => {
          index = (index + 1) % WORDS.length;
          wordEl.textContent = WORDS[index];
          wordEl.classList.remove("is-changing");
        }, FADE);
      };

      // 1回目を早め（FIRST_DELAY後）に実行 → 以降は通常周期でループ
      setTimeout(() => {
        changeWord();                       // 最初の切り替え
        setInterval(changeWord, INTERVAL);  // 2回目以降
      }, FIRST_DELAY);
    }

    /* -----------------------------------------
       2. IntersectionObserver によるフェードイン
       ----------------------------------------- */
    const faders = document.querySelectorAll(".fv-hero__fade");

    if ("IntersectionObserver" in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target); // 一度出したら監視解除
          }
        });
      }, { threshold: 0.2 });

      faders.forEach((el) => observer.observe(el));
    } else {
      // 非対応ブラウザは即時表示（フォールバック）
      faders.forEach((el) => el.classList.add("is-visible"));
    }
  };

  /* -----------------------------------------
     3. 実行タイミング制御
     ----------------------------------------- */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
</script>
