# =============================================================================
# ドゥ.ヨネザワ コーポレートサイト — 確認用プレビュー公開
# -----------------------------------------------------------------------------
# doyg-corporate-site/ を GitHub Pages へ公開し、URLで表示確認できるようにする。
#
# 【初回のみ必要な設定】
#   リポジトリの Settings → Pages → Build and deployment → Source を
#   「GitHub Actions」に変更してください。これをしないと公開されません。
#
# 公開URL: https://<ユーザー名>.github.io/<リポジトリ名>/
# =============================================================================
name: Deploy preview to GitHub Pages

on:
  push:
    branches:
      - claude/do-yonezawa-corporate-site-otpvdz
    paths:
      - 'doyg-corporate-site/**'
      - '.github/workflows/preview-pages.yml'
  # Actions タブから手動で実行することもできる
  workflow_dispatch:

# Pages への公開に必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。実行中のものは完了させてから次へ進む
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages の設定を読み込む（未設定なら自動で有効化する）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 公開対象をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          # サイト本体のみを公開する（docs や他のファイルは含めない）
          path: doyg-corporate-site

      - name: GitHub Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v4
