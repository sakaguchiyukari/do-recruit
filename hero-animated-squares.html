<!--
  SWELL WordPress テーマ用
  採用ファーストビュー（ヒーロー）＋ 文字の真後ろで動く四角形

  使い方:
  ・この中身をまるごと「カスタムHTML」ブロックに貼り付け（JSも同梱済み）
  ・CSS … hero-animated-squares.css の中身を「外観 > カスタマイズ > 追加CSS」に

  ※ SWELLのカスタムHTMLブロックはブロック内の <script> をそのまま実行するため、
    JSは別欄ではなくこのブロック内に入れています。
-->

<!-- キャッチコピー用フォント（Google Fonts）
     別のフォントにする場合は下の href を差し替え、CSS の font-family も合わせて変更:
     ・丸ゴシック : family=M+PLUS+Rounded+1c:wght@700;800
     ・明朝（上品）: family=Shippori+Mincho:wght@700;800
     ・SWELL標準に戻す場合はこの link を削除し、CSSの font-family 指定を削除 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">

<div class="fv-area">

  <section class="fv-hero" id="fvHero">

    <!-- 文字の真後ろで動く四角形（ヒーローの中に配置） -->
    <ul class="circles" aria-hidden="true">
      <li></li><li></li><li></li><li></li><li></li>
      <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- キャッチコピー -->
    <h1 class="fv-hero__copy fv-hero__fade">
      <span class="fv-hero__word" id="fvWord">ITのしごと</span>も<br>
      全部ここにある。
    </h1>

    <!-- サブコピー -->
    <p class="fv-hero__sub fv-hero__fade fv-hero__fade--delay1">
      10の企業法人、社会福祉法人、医療法人社団。<br>
      まいにちに「プラス」をつぎつぎと届ける、多彩な仕事と出会える企業グループです。
    </p>

  </section>

</div>

<script>
(function () {
  var run = function () {

    /* 業種ワード切替 */
    var words = [
      "ITのしごと",
      "ゴルフのしごと",
      "販売のしごと",
      "飲食のしごと",
      "健康のしごと"
    ];
    var wordEl = document.getElementById("fvWord");
    if (wordEl) {
      var index = 0;
      setInterval(function () {
        wordEl.classList.add("is-changing");
        setTimeout(function () {
          index = (index + 1) % words.length;
          wordEl.textContent = words[index];
          wordEl.classList.remove("is-changing");
        }, 450);
      }, 3200);
    }

    /* フェードイン */
    var faders = document.querySelectorAll(".fv-hero__fade");
    if ("IntersectionObserver" in window) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.2 });
      faders.forEach(function (el) { observer.observe(el); });
    } else {
      faders.forEach(function (el) { el.classList.add("is-visible"); });
    }
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
</script>
