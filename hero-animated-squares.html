<!--
  SWELL WordPress テーマ用
  採用ファーストビュー（ヒーロー）＋ 背景で動く四角形アニメーション

  使い方:
  このファイルの中身を「カスタムHTML」ブロックにまるごと貼り付けるだけです。
  <style> / <script> も含めて1ブロックで完結します。

  ポイント（修正済み）:
  1. .area を position: relative にして、動く四角形をヒーローに重ねる
  2. 背景色（青グラデーション）を削除し透明に
  3. 四角形の色を「白の半透明」→ 白背景でも見えるオレンジ系の半透明に変更
     （--sq-color で色・濃さを調整できます）
  4. * や body への全体リセットをやめ、すべて .area 配下にスコープして
     SWELLテーマ全体を壊さないように
-->

<style>
/* =========================================================
   Variables
========================================================= */
.fv-area {
  --fv-color-text: #111111;
  --fv-color-accent: #e0870a;

  /* 動く四角形の色（透明背景でも見えるように） */
  --sq-color: rgba(224, 135, 10, 0.18);

  --fv-space-block: clamp(1.2rem, 3vw, 2.4rem);
  --fv-space-inline: clamp(1rem, 4vw, 2rem);

  --fv-accent-gradient:
    linear-gradient(135deg, #ffd36b 0%, #ffb547 45%, #ff8a3d 100%);
}

/* =========================================================
   Area（背景は透明）
========================================================= */
.fv-area {
  position: relative;      /* ← これが無いと四角形が飛んでいく */
  width: 100%;
  min-height: 100vh;
  overflow: hidden;
  background: transparent;  /* ← 背景色なし（無色） */
  box-sizing: border-box;
}

/* =========================================================
   Hero（四角形より前面に）
========================================================= */
.fv-hero {
  position: relative;
  z-index: 1;
  width: min(100%, 1200px);
  margin-inline: auto;
  padding: var(--fv-space-block) var(--fv-space-inline);
  text-align: center;
  color: var(--fv-color-text);
  box-sizing: border-box;
}

/* Fade Animation */
.fv-hero__fade {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.fv-hero__fade.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.fv-hero__fade--delay1 {
  transition-delay: 0.25s;
}

/* Copy */
.fv-hero__copy {
  margin: 0 0 var(--fv-space-block);
  font-size: clamp(2.4rem, 8vw, 4.8rem);
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: 0.04em;
}

/* 切り替わるテキスト */
.fv-hero__word {
  display: inline-block;
  min-width: 7em;
  text-align: center;
  background: var(--fv-accent-gradient);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  transition: opacity 0.45s ease, transform 0.45s ease;
  text-shadow: 0 2px 10px rgba(255, 181, 71, 0.25);
}
.fv-hero__word.is-changing {
  opacity: 0;
  transform: translateY(0.4em);
}

/* Sub Copy */
.fv-hero__sub {
  margin: 0 0 var(--fv-space-block);
  font-size: clamp(0.9rem, 2.4vw, 1.1rem);
  line-height: 2;
  letter-spacing: 0.06em;
}

/* =========================================================
   動く四角形（circles）
========================================================= */
.fv-area .circles {
  position: absolute;
  inset: 0;              /* top/left/right/bottom: 0 */
  z-index: 0;            /* ヒーローの後ろ */
  margin: 0;
  padding: 0;
  list-style: none;
  overflow: hidden;
  pointer-events: none;  /* クリックを邪魔しない */
}

.fv-area .circles li {
  position: absolute;
  display: block;
  list-style: none;
  bottom: -150px;
  width: 20px;
  height: 20px;
  background: var(--sq-color);
  animation: fv-animate 25s linear infinite;
}

.fv-area .circles li:nth-child(1)  { left: 25%; width: 80px;  height: 80px;  animation-delay: 0s; }
.fv-area .circles li:nth-child(2)  { left: 10%; width: 20px;  height: 20px;  animation-delay: 2s;  animation-duration: 12s; }
.fv-area .circles li:nth-child(3)  { left: 70%; width: 20px;  height: 20px;  animation-delay: 4s; }
.fv-area .circles li:nth-child(4)  { left: 40%; width: 60px;  height: 60px;  animation-delay: 0s;  animation-duration: 18s; }
.fv-area .circles li:nth-child(5)  { left: 65%; width: 20px;  height: 20px;  animation-delay: 0s; }
.fv-area .circles li:nth-child(6)  { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
.fv-area .circles li:nth-child(7)  { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
.fv-area .circles li:nth-child(8)  { left: 50%; width: 25px;  height: 25px;  animation-delay: 15s; animation-duration: 45s; }
.fv-area .circles li:nth-child(9)  { left: 20%; width: 15px;  height: 15px;  animation-delay: 2s;  animation-duration: 35s; }
.fv-area .circles li:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s;  animation-duration: 11s; }

@keyframes fv-animate {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 1;
    border-radius: 0;
  }
  100% {
    transform: translateY(-1000px) rotate(720deg);
    opacity: 0;
    border-radius: 50%;
  }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
  .fv-area .circles li { animation: none; opacity: 0; }
}
</style>

<!-- ===================== HTML ===================== -->
<div class="fv-area">

  <section class="fv-hero" id="fvHero">

    <!-- キャッチコピー -->
    <h1 class="fv-hero__copy fv-hero__fade">
      <span class="fv-hero__word" id="fvWord">ITのしごと</span>も<br>
      全部ここにある。
    </h1>

    <!-- サブコピー -->
    <p class="fv-hero__sub fv-hero__fade fv-hero__fade--delay1">
      10の企業法人、社会福祉法人、医療法人社団。<br>
      まいにちに「プラス」をつぎつぎと届ける、多彩な仕事と出会える企業グループです。
    </p>

  </section>

  <!-- 背景で動く四角形 -->
  <ul class="circles">
    <li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li>
  </ul>

</div>

<!-- ===================== JS ===================== -->
<script>
(function () {
  var run = function () {

    /* 業種ワード切替 */
    var words = [
      "ITのしごと",
      "ゴルフのしごと",
      "販売のしごと",
      "飲食のしごと",
      "健康のしごと"
    ];
    var wordEl = document.getElementById("fvWord");
    if (wordEl) {
      var index = 0;
      setInterval(function () {
        wordEl.classList.add("is-changing");
        setTimeout(function () {
          index = (index + 1) % words.length;
          wordEl.textContent = words[index];
          wordEl.classList.remove("is-changing");
        }, 450);
      }, 3200);
    }

    /* フェードイン */
    var faders = document.querySelectorAll(".fv-hero__fade");
    if ("IntersectionObserver" in window) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.2 });
      faders.forEach(function (el) { observer.observe(el); });
    } else {
      /* 非対応ブラウザは即表示 */
      faders.forEach(function (el) { el.classList.add("is-visible"); });
    }
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
</script>
