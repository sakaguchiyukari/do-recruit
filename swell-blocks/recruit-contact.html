<!-- ==========================================================================
     Recruit Contact CTA（募集要項ページ最下部／SWELL カスタムHTMLブロック用）
     このファイルの内容をそのままカスタムHTMLブロックに貼り付けて使用します。
     画像パス・電話番号・メールアドレスは仮値のため差し替えてください。
     ========================================================================== -->

<style>
/* ==========================================================================
   Recruit Contact CTA / Styles
   - プレフィックス .recruit-contact でSWELL標準CSSとの競合を避ける
   - 変数はブロックの親要素内に閉じ、グローバルへ影響させない
   ========================================================================== */
.recruit-contact {
  /* Color ------------------------------------------------------------ */
  --rc-navy: #0b2545;
  --rc-navy-deep: #061727;
  --rc-navy-soft: #1c3a5e;
  --rc-white: #ffffff;
  --rc-text: #14181c;
  --rc-text-muted: #5b6570;
  --rc-text-inverse-muted: #c6d2de;
  --rc-rule: #e4e8ed;

  /* Background image（仮ファイル名：差し替えてください） -------------- */
  --rc-bg-image: url("images/recruit-contact-bg.jpg");

  /* Size / Space ------------------------------------------------------ */
  --rc-gutter: clamp(1.25rem, 5vw, 3rem);
  --rc-band-top: clamp(3rem, 8vw, 5.5rem);
  --rc-overhang: clamp(2rem, 7vw, 4rem); /* カードが背景からはみ出す量 */
  --rc-card-padding: clamp(1.25rem, 4vw, 2.25rem) clamp(1rem, 4vw, 2.5rem);
  --rc-icon-size: clamp(2.75rem, 8vw, 3.5rem);
  --rc-max-width: 760px;

  /* Style ------------------------------------------------------------- */
  --rc-radius: 18px;
  --rc-shadow: 0 18px 40px rgba(11, 37, 69, 0.14);
  --rc-shadow-hover: 0 24px 56px rgba(11, 37, 69, 0.2);
  --rc-ease: cubic-bezier(0.16, 1, 0.3, 1);
  --rc-dur: 400ms;

  position: relative;
  padding: var(--rc-band-top) var(--rc-gutter) 0;
  color: var(--rc-text);
  font-family: inherit;
  line-height: 1.8;
  letter-spacing: 0.04em;
}

/* --------------------------------------------------------------------------
   背景（写真＋ネイビーのオーバーレイ）
   カード下部が背景からはみ出すよう bottom を空けている
   -------------------------------------------------------------------------- */
.recruit-contact__bg {
  position: absolute;
  top: 0;
  right: 0;
  bottom: var(--rc-overhang);
  left: 0;
  z-index: 0;
  background-color: var(--rc-navy);
  background-image: var(--rc-bg-image);
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}

.recruit-contact__bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(11, 37, 69, 0.88) 0%,
    rgba(11, 37, 69, 0.94) 60%,
    rgba(6, 23, 39, 0.96) 100%
  );
}

/* --------------------------------------------------------------------------
   インナー
   -------------------------------------------------------------------------- */
.recruit-contact__inner {
  position: relative;
  z-index: 1;
  max-width: var(--rc-max-width);
  margin-inline: auto;
}

/* --------------------------------------------------------------------------
   見出しエリア
   -------------------------------------------------------------------------- */
.recruit-contact__head {
  text-align: center;
  color: var(--rc-white);
}

.recruit-contact__title {
  margin: 0;
  color: var(--rc-white);
  font-size: clamp(1.375rem, 1.1rem + 1.4vw, 2rem);
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: 0.06em;
}

.recruit-contact__lead {
  max-width: 30em;
  margin: clamp(0.75rem, 2.5vw, 1.25rem) auto 0;
  color: var(--rc-text-inverse-muted);
  font-size: clamp(0.875rem, 0.82rem + 0.3vw, 1rem);
  line-height: 1.9;
}

/* 文節単位で改行させ、語の途中で折り返さないようにする */
.recruit-contact__lead > span {
  display: inline-block;
}

/* --------------------------------------------------------------------------
   カード
   -------------------------------------------------------------------------- */
.recruit-contact__card {
  margin-top: clamp(1.75rem, 5vw, 2.75rem);
  padding: var(--rc-card-padding);
  border-radius: var(--rc-radius);
  background-color: var(--rc-white);
  box-shadow: var(--rc-shadow);
}

.recruit-contact__list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.recruit-contact__item + .recruit-contact__item {
  border-top: 1px solid var(--rc-rule);
}

/* --------------------------------------------------------------------------
   連絡先リンク
   -------------------------------------------------------------------------- */
.recruit-contact__link {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: clamp(0.875rem, 3vw, 1.25rem);
  padding: clamp(0.875rem, 3vw, 1.375rem) clamp(0.25rem, 2vw, 0.75rem);
  border-radius: 12px;
  color: inherit;
  text-decoration: none;
  transition: background-color var(--rc-dur) var(--rc-ease),
    transform var(--rc-dur) var(--rc-ease);
}

.recruit-contact__link:focus-visible {
  outline: 2px solid var(--rc-navy);
  outline-offset: 2px;
}

.recruit-contact__icon {
  display: grid;
  place-items: center;
  width: var(--rc-icon-size);
  height: var(--rc-icon-size);
  border-radius: 50%;
  background-color: var(--rc-navy);
  color: var(--rc-white);
  transition: background-color var(--rc-dur) var(--rc-ease),
    transform var(--rc-dur) var(--rc-ease);
}

.recruit-contact__icon svg {
  width: 45%;
  height: auto;
  fill: currentColor;
}

.recruit-contact__body {
  display: grid;
  gap: 0.25rem;
  min-width: 0;
}

.recruit-contact__label {
  color: var(--rc-text-muted);
  font-size: clamp(0.75rem, 0.72rem + 0.15vw, 0.8125rem);
  line-height: 1.6;
  letter-spacing: 0.08em;
}

.recruit-contact__value {
  overflow-wrap: anywhere;
  color: var(--rc-navy);
  font-size: clamp(1.125rem, 0.95rem + 0.9vw, 1.5rem);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: 0.02em;
  font-feature-settings: "palt";
}

/* メールアドレスは文字数が多いため一段小さく表示する */
.recruit-contact__value--email {
  font-size: clamp(0.9375rem, 0.75rem + 0.9vw, 1.375rem);
  letter-spacing: 0;
}

.recruit-contact__arrow {
  display: grid;
  place-items: center;
  width: 1.25rem;
  height: 1.25rem;
  color: var(--rc-text-muted);
  transition: transform var(--rc-dur) var(--rc-ease),
    color var(--rc-dur) var(--rc-ease);
}

.recruit-contact__arrow svg {
  width: 100%;
  height: auto;
  fill: currentColor;
}

/* --------------------------------------------------------------------------
   カード下部のメッセージ
   -------------------------------------------------------------------------- */
.recruit-contact__note {
  display: flex;
  align-items: center;
  gap: clamp(0.75rem, 3vw, 1.25rem);
  margin: clamp(1rem, 3vw, 1.5rem) 0 0;
  color: var(--rc-navy-soft);
  font-size: clamp(0.75rem, 0.72rem + 0.2vw, 0.875rem);
  letter-spacing: 0.08em;
  text-align: center;
}

.recruit-contact__note::before,
.recruit-contact__note::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background-color: var(--rc-rule);
}

/* --------------------------------------------------------------------------
   ホバー（ポインターデバイスのみ）
   -------------------------------------------------------------------------- */
@media (hover: hover) {
  .recruit-contact__link:hover {
    background-color: #f4f7fb;
  }

  .recruit-contact__link:hover .recruit-contact__icon {
    background-color: var(--rc-navy-soft);
    transform: translateY(-2px);
  }

  .recruit-contact__link:hover .recruit-contact__arrow {
    color: var(--rc-navy);
    transform: translateX(4px);
  }

  .recruit-contact__card:hover {
    box-shadow: var(--rc-shadow-hover);
  }
}

/* --------------------------------------------------------------------------
   フェードイン（JSが .is-ready を付与した場合のみ有効化）
   -------------------------------------------------------------------------- */
.recruit-contact.is-ready .recruit-contact__reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 800ms var(--rc-ease), transform 800ms var(--rc-ease);
}

.recruit-contact.is-ready .recruit-contact__reveal--delay {
  transition-delay: 120ms;
}

.recruit-contact.is-ready .recruit-contact__reveal.is-visible {
  opacity: 1;
  transform: none;
}

/* --------------------------------------------------------------------------
   モーション軽減設定への配慮
   -------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  .recruit-contact.is-ready .recruit-contact__reveal {
    opacity: 1;
    transform: none;
    transition: none;
  }

  .recruit-contact__link,
  .recruit-contact__icon,
  .recruit-contact__arrow {
    transition: none;
  }
}
</style>

<!-- ==========================================================================
     Recruit Contact CTA / Markup
     ========================================================================== -->
<section class="recruit-contact" aria-labelledby="recruit-contact-title">
  <!-- 背景（装飾のため aria-hidden） -->
  <div class="recruit-contact__bg" aria-hidden="true"></div>

<script>
/* ==========================================================================
   Recruit Contact CTA / Script
   IntersectionObserver によるフェードイン。
   JSが無効な場合はCSSのフェードイン初期状態を適用しないため、
   コンテンツは常に表示される。
   ========================================================================== */
(() => {
  const sections = document.querySelectorAll('.recruit-contact');
  if (!sections.length) return;

  // IntersectionObserver 非対応時は演出なしで表示する
  const supported = 'IntersectionObserver' in window;

  const observer = supported
    ? new IntersectionObserver(
        (entries, obs) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add('is-visible');
            obs.unobserve(entry.target);
          });
        },
        { rootMargin: '0px 0px -10% 0px', threshold: 0.15 }
      )
    : null;

  sections.forEach((section) => {
    if (section.dataset.rcReady === 'true') return;
    section.dataset.rcReady = 'true';

    const targets = section.querySelectorAll('.recruit-contact__reveal');
    if (!targets.length) return;

    if (!observer) {
      targets.forEach((target) => target.classList.add('is-visible'));
      return;
    }

    // 初期状態を有効化してから監視を開始する
    section.classList.add('is-ready');
    targets.forEach((target) => observer.observe(target));
  });
})();
</script>
