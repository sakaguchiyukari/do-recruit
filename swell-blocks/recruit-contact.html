<!-- ==========================================================================
     Recruit Contact CTA（募集要項ページ最下部／SWELL カスタムHTMLブロック用）
     背景・見出しは既存ブロックを使用するため、このブロックはカードのみ
     ========================================================================== -->

<style>
/* ==========================================================================
   Recruit Contact CTA
   - 専用プレフィックスでSWELL標準CSSとの競合を避ける
   - 変数はブロック内に閉じ、グローバルへ影響させない
   ========================================================================== */
.recruit-contact {
  /* Color */
  --rc-navy: #2f6ea0;
  --rc-navy-soft: #1c3a5e;
  --rc-white: #ffffff;
  --rc-text: #14181c;
  --rc-text-muted: #5b6570;
  --rc-rule: #e4e8ed;

  /* Size / Space */
  --rc-gutter: clamp(1rem, 4vw, 2rem);
  --rc-card-padding: clamp(1rem, 3vw, 2rem);
  --rc-icon-size: clamp(2.75rem, 7vw, 3.5rem);
  --rc-max-width: 760px;

  /* Style */
  --rc-radius: 18px;
  --rc-shadow: 0 12px 32px rgba(11, 37, 69, 0.1);
  --rc-shadow-hover: 0 18px 42px rgba(11, 37, 69, 0.16);
  --rc-ease: cubic-bezier(0.16, 1, 0.3, 1);
  --rc-dur: 400ms;

  max-width: var(--rc-max-width);
  /* 直前のブロックとの余白は既存ブロック側で調整するためリセット */
  margin: 0 auto !important;
  padding-inline: var(--rc-gutter);
  color: var(--rc-text);
  line-height: 1.8;
  letter-spacing: 0.04em;
}

/* --------------------------------------------------------------------------
   カード
   -------------------------------------------------------------------------- */
.recruit-contact__card {
  padding: var(--rc-card-padding);
  border: 1px solid var(--rc-rule);
  border-radius: var(--rc-radius);
  background-color: var(--rc-white);
  box-shadow: var(--rc-shadow);
  transition: box-shadow var(--rc-dur) var(--rc-ease);
}

.recruit-contact__list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.recruit-contact__item + .recruit-contact__item {
  border-top: 1px solid var(--rc-rule);
}

/* --------------------------------------------------------------------------
   連絡先リンク
   -------------------------------------------------------------------------- */
.recruit-contact__link {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: clamp(0.75rem, 3vw, 1.25rem);
  padding: clamp(0.875rem, 3vw, 1.25rem) clamp(0.25rem, 2vw, 0.75rem);
  border-radius: 12px;
  color: inherit;
  text-decoration: none;
  transition: background-color var(--rc-dur) var(--rc-ease);
}

.recruit-contact__link:focus-visible {
  outline: 2px solid var(--rc-navy);
  outline-offset: 2px;
}

.recruit-contact__icon {
  display: grid;
  place-items: center;
  width: var(--rc-icon-size);
  height: var(--rc-icon-size);
  border-radius: 50%;
  background-color: var(--rc-navy);
  color: var(--rc-white);
  transition: background-color var(--rc-dur) var(--rc-ease),
    transform var(--rc-dur) var(--rc-ease);
}

.recruit-contact__icon svg {
  width: 45%;
  height: auto;
  fill: currentColor;
}

.recruit-contact__body {
  display: grid;
  gap: 0.2rem;
  min-width: 0;
}

.recruit-contact__label {
  color: var(--rc-text-muted);
  font-size: clamp(0.75rem, 0.72rem + 0.15vw, 0.8125rem);
  line-height: 1.6;
  letter-spacing: 0.08em;
}

.recruit-contact__value {
  overflow-wrap: anywhere;
  color: var(--rc-navy);
  font-size: clamp(1.125rem, 0.95rem + 0.9vw, 1.5rem);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: 0.02em;
  font-feature-settings: "palt";
}

/* メールアドレスは長くなりやすいため一段小さくする */
.recruit-contact__value--email {
  font-size: clamp(0.875rem, 0.75rem + 0.7vw, 1.375rem);
  letter-spacing: 0;
}

.recruit-contact__arrow {
  display: grid;
  place-items: center;
  width: 1.25rem;
  height: 1.25rem;
  color: var(--rc-text-muted);
  transition: transform var(--rc-dur) var(--rc-ease),
    color var(--rc-dur) var(--rc-ease);
}

.recruit-contact__arrow svg {
  width: 100%;
  height: auto;
  fill: currentColor;
}

/* --------------------------------------------------------------------------
   下部メッセージ（前後にヘアライン）
   -------------------------------------------------------------------------- */
.recruit-contact__note {
  display: flex;
  align-items: center;
  gap: clamp(0.75rem, 3vw, 1.25rem);
  margin: clamp(1rem, 3vw, 1.5rem) 0 0;
  color: var(--rc-navy-soft);
  font-size: 0.875rem; /* 14px 固定 */
  line-height: 1.7;
  letter-spacing: 0.06em;
}

.recruit-contact__note::before,
.recruit-contact__note::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background-color: var(--rc-rule);
}

/* --------------------------------------------------------------------------
   ホバー
   -------------------------------------------------------------------------- */
@media (hover: hover) {
  .recruit-contact__card:hover {
    box-shadow: var(--rc-shadow-hover);
  }

  .recruit-contact__link:hover {
    background-color: #f4f7fb;
  }

  .recruit-contact__link:hover .recruit-contact__icon {
    background-color: var(--rc-navy-soft);
    transform: translateY(-2px);
  }

  .recruit-contact__link:hover .recruit-contact__arrow {
    color: var(--rc-navy);
    transform: translateX(4px);
  }
}

/* --------------------------------------------------------------------------
   フェードイン（JSが .is-ready を付与した場合のみ有効）
   JSが動作しない環境ではコンテンツは常に表示される
   -------------------------------------------------------------------------- */
.recruit-contact.is-ready .recruit-contact__reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 800ms var(--rc-ease), transform 800ms var(--rc-ease);
}

.recruit-contact.is-ready .recruit-contact__reveal.is-visible {
  opacity: 1;
  transform: none;
}

@media (prefers-reduced-motion: reduce) {
  .recruit-contact.is-ready .recruit-contact__reveal {
    opacity: 1;
    transform: none;
  }

  .recruit-contact__card,
  .recruit-contact__link,
  .recruit-contact__icon,
  .recruit-contact__arrow,
  .recruit-contact__reveal {
    transition: none;
  }
}

/* --------------------------------------------------------------------------
   スマートフォン
   -------------------------------------------------------------------------- */
@media (max-width: 480px) {
  .recruit-contact {
    padding-inline: 0;
  }

  .recruit-contact__arrow {
    width: 1rem;
    height: 1rem;
  }
}
</style>

<section class="recruit-contact" aria-label="応募・お問い合わせ">

    <ul class="recruit-contact__list">

<script>
/* ==========================================================================
   Recruit Contact CTA / フェードイン
   ========================================================================== */
(() => {
  if (!('IntersectionObserver' in window)) return;

  const targets = document.querySelectorAll('.recruit-contact__reveal');
  if (!targets.length) return;

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach(({ isIntersecting, target }) => {
        if (!isIntersecting) return;
        target.classList.add('is-visible');
        observer.unobserve(target);
      });
    },
    { rootMargin: '0px 0px -10% 0px', threshold: 0.15 }
  );

  targets.forEach((target) => {
    target.closest('.recruit-contact').classList.add('is-ready');
    observer.observe(target);
  });
})();
</script>
