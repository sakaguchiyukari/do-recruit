<!-- ==========================================================================
     Recruit Fixed CTA（スマホのみ／画面下部に固定）
     SWELL カスタムHTMLブロック用
     CSSは recruit-fixed-cta.css / スクリプトは recruit-fixed-cta.js
     ※リンク先とラベル・補足テキストは実際の内容に差し替えてください
     ========================================================================== -->

<nav class="recruit-fixed-cta" aria-label="応募メニュー">
  <!-- トップへ戻る（バーの右上に配置） -->
  <button class="recruit-fixed-cta__totop" type="button" aria-label="ページの先頭へ戻る">
    <span class="recruit-fixed-cta__totop-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false">
        <path d="M5.3 14.7a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0l6 6a1 1 0 1 1-1.4 1.4L12 9.4l-5.3 5.3a1 1 0 0 1-1.4 0z"></path>
      </svg>
    </span>
  </button>

  <a class="recruit-fixed-cta__button" href="/recruit/">
    <!-- メインラベル -->
    <span class="recruit-fixed-cta__main">
      採用情報を見る
      <span class="recruit-fixed-cta__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M9.3 5.3a1 1 0 0 1 1.4 0l6 6a1 1 0 0 1 0 1.4l-6 6a1 1 0 1 1-1.4-1.4l5.3-5.3-5.3-5.3a1 1 0 0 1 0-1.4z"></path>
        </svg>
      </span>
    </span>

    <!-- 補足テキスト -->
    <span class="recruit-fixed-cta__sub">グループ各社の求人を掲載中</span>
  </a>
</nav>
