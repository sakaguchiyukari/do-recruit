<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icon Sprite
  ───────────────────────────────────────────────────────────────────────────
  24×24 グリッド / 線幅1.5px / 塗りなし / 角丸2px。
  色は参照側の currentColor を継承するため、ここでは指定しない。
  参照例： class="c-icon" の svg 内で use href="/assets/icon/sprite.svg#arrow-right"
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">

  <!-- 右矢印：リンク全般・「詳しく見る」 -->
  <symbol id="arrow-right" viewBox="0 0 24 24">
    <path d="M4 12h16" />
    <path d="M14 6l6 6-6 6" />
  </symbol>

  <!-- 下矢印：スクロール誘導 -->
  <symbol id="arrow-down" viewBox="0 0 24 24">
    <path d="M12 4v16" />
    <path d="M6 14l6 6 6-6" />
  </symbol>

  <!-- 斜め右上矢印：外部リンク・別タブ -->
  <symbol id="arrow-up-right" viewBox="0 0 24 24">
    <path d="M7 17L17 7" />
    <path d="M8 7h9v9" />
  </symbol>

  <!-- ハンバーガー -->
  <symbol id="menu" viewBox="0 0 24 24">
    <path d="M3 8h18" />
    <path d="M3 16h18" />
  </symbol>

  <!-- 閉じる -->
  <symbol id="close" viewBox="0 0 24 24">
    <path d="M5 5l14 14" />
    <path d="M19 5L5 19" />
  </symbol>

  <!-- プラス：アコーディオン開 -->
  <symbol id="plus" viewBox="0 0 24 24">
    <path d="M12 5v14" />
    <path d="M5 12h14" />
  </symbol>

  <!-- マイナス：アコーディオン閉 -->
  <symbol id="minus" viewBox="0 0 24 24">
    <path d="M5 12h14" />
  </symbol>

  <!-- メール -->
  <symbol id="mail" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="14" rx="2" />
    <path d="M3.5 7l8.5 6 8.5-6" />
  </symbol>

  <!-- 電話 -->
  <symbol id="phone" viewBox="0 0 24 24">
    <path d="M21.5 16.9v2.9a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 1.6 4.1 2 2 0 0 1 3.6 2h2.9a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.4 2.1L7.6 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" />
  </symbol>

  <!-- 位置 -->
  <symbol id="pin" viewBox="0 0 24 24">
    <path d="M20 10.5c0 5.5-8 12-8 12s-8-6.5-8-12a8 8 0 0 1 16 0z" />
    <circle cx="12" cy="10.5" r="2.8" />
  </symbol>

  <!-- 書類：会社案内・募集要項 -->
  <symbol id="document" viewBox="0 0 24 24">
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
    <path d="M14 3v5h5" />
    <path d="M9 13h6" />
    <path d="M9 17h4" />
  </symbol>

  <!-- ダウンロード：PDF・パンフレット -->
  <symbol id="download" viewBox="0 0 24 24">
    <path d="M12 3v12" />
    <path d="M7.5 10.5L12 15l4.5-4.5" />
    <path d="M4 19h16" />
  </symbol>

  <!-- カレンダー：ニュース日付・説明会日程 -->
  <symbol id="calendar" viewBox="0 0 24 24">
    <rect x="3.5" y="5" width="17" height="16" rx="2" />
    <path d="M3.5 10h17" />
    <path d="M8 3v4" />
    <path d="M16 3v4" />
  </symbol>

  <!-- 再生 -->
  <symbol id="play" viewBox="0 0 24 24">
    <path d="M8 5.5l11 6.5-11 6.5z" />
  </symbol>

  <!-- 一時停止：動画停止ボタン（アクセシビリティ必須） -->
  <symbol id="pause" viewBox="0 0 24 24">
    <path d="M9.5 5v14" />
    <path d="M14.5 5v14" />
  </symbol>

  <!-- 前へ：ページネーション -->
  <symbol id="chevron-left" viewBox="0 0 24 24">
    <path d="M15 5l-7 7 7 7" />
  </symbol>

  <!-- 次へ：ページネーション -->
  <symbol id="chevron-right" viewBox="0 0 24 24">
    <path d="M9 5l7 7-7 7" />
  </symbol>

  <!-- 外部サイト：グループ会社サイトへのリンク -->
  <symbol id="external" viewBox="0 0 24 24">
    <path d="M13 4h7v7" />
    <path d="M20 4l-9 9" />
    <path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" />
  </symbol>

  <!-- 葉：環境領域 -->
  <symbol id="leaf" viewBox="0 0 24 24">
    <path d="M4 20c0-8 5-14 16-15 0 10-5 15-11 15-2.5 0-5-1.5-5-1.5z" />
    <path d="M4 20c3-5 7-8 12-10" />
  </symbol>

  <!-- 鼓動：健康領域 -->
  <symbol id="heart-pulse" viewBox="0 0 24 24">
    <path d="M20.5 8.5a4.5 4.5 0 0 0-8.5-2 4.5 4.5 0 0 0-8.5 2c0 5 8.5 10.5 8.5 10.5s8.5-5.5 8.5-10.5z" />
    <path d="M3.5 11.5h4l1.5-2.5 2 5 1.5-2.5h4" />
  </symbol>

  <!-- 電波：デジタル領域 -->
  <symbol id="signal" viewBox="0 0 24 24">
    <path d="M5 19v-4" />
    <path d="M10 19v-8" />
    <path d="M15 19v-12" />
    <path d="M20 19V5" />
  </symbol>

  <!-- 検索 -->
  <symbol id="search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="6.5" />
    <path d="M16 16l4.5 4.5" />
  </symbol>

</svg>
